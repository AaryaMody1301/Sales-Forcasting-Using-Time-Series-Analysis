name: Release benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-benchmark.txt

      - name: Install locked benchmark dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-benchmark.txt
          python -m pip check

      - name: Capture benchmark environment
        shell: bash
        run: |
          mkdir -p release_benchmark
          python --version > release_benchmark/environment.txt
          python -m pip --version >> release_benchmark/environment.txt
          python -m pip freeze | sort >> release_benchmark/environment.txt

      - name: Run and verify reviewed release benchmark
        shell: bash
        run: |
          set -o pipefail
          python scripts/release_benchmark.py 2>&1 | tee release_benchmark/run.log

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-benchmark
          path: release_benchmark/
          if-no-files-found: error
