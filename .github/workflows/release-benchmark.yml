name: Release benchmark

on:
  push:
    branches:
      - refactor/phase-7-v1-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[prophet]"

      - name: Run real-data release benchmark
        run: python scripts/release_benchmark.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark
          path: release_benchmark/
          if-no-files-found: error
