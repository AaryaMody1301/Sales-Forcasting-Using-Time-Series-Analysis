name: Cleanup stale branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete stale bot branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in "dependabot/github_actions/actions/upload-artifact-7.0.1" "imgbot"; do
            encoded="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
              echo "deleted branch: ${branch}"
            fi
          done
