[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-forecasting-time-series"
version = "1.0.1"
description = "Leakage-aware, reproducible time-series forecasting with chronological evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aarya Mody" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
    "xgboost>=2.1,<4",
]

[project.urls]
Homepage = "https://github.com/AaryaMody1301/Sales-Forcasting-Using-Time-Series-Analysis"
Repository = "https://github.com/AaryaMody1301/Sales-Forcasting-Using-Time-Series-Analysis"
Issues = "https://github.com/AaryaMody1301/Sales-Forcasting-Using-Time-Series-Analysis/issues"
Changelog = "https://github.com/AaryaMody1301/Sales-Forcasting-Using-Time-Series-Analysis/blob/main/CHANGELOG.md"

[project.scripts]
sales-forecast = "sales_forecasting.cli:main"

[project.optional-dependencies]
prophet = [
    "prophet>=1.4,<2",
]
dashboard = [
    "streamlit>=1.61,<2",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sales_forecasting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
