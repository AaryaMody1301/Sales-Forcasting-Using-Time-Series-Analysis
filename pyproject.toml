[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-forecasting-time-series"
version = "0.1.0"
description = "Leakage-aware foundations for reproducible time-series forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aarya Mody" }]
dependencies = [
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sales_forecasting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
